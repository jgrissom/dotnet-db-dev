name: Check docs

on:
  push:
    branches: [main]
    # The workflow's own file is in this list on purpose: without it, a change
    # to the checks below can't re-run them, and a fix looks unverified because
    # nothing fires.
    paths:
      - "**/*.md"
      - "scripts/check-*.js"
      - ".github/workflows/check-docs.yml"
  schedule:
    - cron: "0 12 * * 1"   # Mondays: full check including external URLs
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save github-slugger
      - name: Internal links + anchors (every push)
        run: node scripts/check-links.js .
      - name: Week README tables — columns 1–2 must not wrap
        run: node scripts/check-tables.js .
      - name: Demo cues line up with the slide decks
        run: node scripts/check-cues.js .
      - name: Emphasis that would render as literal asterisks
        run: node scripts/check-emphasis.js .
      - name: External URLs (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: node scripts/check-links.js . --external

