name: Check docs

on:
  push:
    branches: [main]
    # The workflow's own file is in this list on purpose: without it, a change
    # to the checks below can't re-run them, and a fix looks unverified because
    # nothing fires.
    paths:
      - "**/*.md"
      - "scripts/check-*.js"
      - ".github/workflows/check-docs.yml"
  schedule:
    - cron: "0 12 * * 1"   # Mondays: full check including external URLs
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save github-slugger
      - name: Internal links + anchors (every push)
        run: node scripts/check-links.js .
      - name: Week README tables — columns 1–2 must not wrap
        run: node scripts/check-tables.js .
      - name: Demo cues line up with the slide decks
        run: node scripts/check-cues.js .
      - name: Emphasis that would render as literal asterisks
        run: node scripts/check-emphasis.js .
      - name: Every homework scaffolds its own commits
        run: node scripts/check-commit-points.js .
      # The course is written in plain American English. This was a RULE for
      # months and drifted anyway — 54 files, a week title, and the banner
      # Haldane prints on the projector every week. A rule with no command
      # behind it is a rule nobody can run.
      #
      # ⚠️ Only THIS repo is checked out here. The keys, the starters and
      # dutyconsole carry check messages and boards too — run it across all
      # four locally before a handover:
      #   node scripts/check-americanisms.js ../dotnet-db-dev-answer-keys \
      #        ../dotnet-db-starters ../dutyconsole .
      # A REVIEW SURFACE, not a gate — it always exits 0. Judging whether a
      # spoken line is a riddle is human work; what is automated is that the
      # numbers exist, so the pass cannot be claimed without them. A judgment
      # check that fails the build gets silenced, and then nobody reads.
      - name: Spoken lines — long sentences and semicolons (numbers for the handover)
        run: node scripts/check-spoken.js .
      - name: Plain American English (patterns self-test, then scan)
        run: |
          node scripts/check-americanisms.js --selftest
          node scripts/check-americanisms.js .
      # Step 0 of the closing checklist, here so it cannot be skipped. It FAILS
      # on a countable falling to zero, a missing CLI-fallback block, TODO — Task
      # N out of order, or a timing table that isn't 225 with no drift.
      #
      # ⚠️ The TODO-order row needs the starters repo, which is a different repo
      # and is not checked out here — that row WARNS "not checked" in CI and is
      # only real on a machine where dotnet-db-starters is a sibling. Run it
      # locally before every handover; CI is the backstop, not the check.
      - name: Week inventory — nothing countable silently went to zero
        run: node scripts/check-inventory.js .
      - name: External URLs (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: node scripts/check-links.js . --external

