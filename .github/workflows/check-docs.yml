name: Check docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/check-links.js", "scripts/check-tables.js", "scripts/check-cues.js"]
  schedule:
    - cron: "0 12 * * 1"   # Mondays: full check including external URLs
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save github-slugger
      - name: Internal links + anchors (every push)
        run: node scripts/check-links.js .
      - name: Week README tables — columns 1–2 must not wrap
        run: node scripts/check-tables.js .
      - name: Demo cues line up with the slide decks
        run: node scripts/check-cues.js .
      - name: External URLs (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: node scripts/check-links.js . --external

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Every lab starter must build, and its checks project must RUN — a starter
      # that doesn't compile wastes the first ten minutes of a lab for everybody.
      # FAILING TESTS ARE THE EXPECTED RESULT: a starter is red on purpose, and
      # week 1's reports 1/5 by design. A build error or a crash is not.
      #
      # Console programs block on ReadLine forever, so stdin gets a few newlines
      # (which satisfies an interactive program rather than making ReadLine
      # return null) and every run is capped.
      - name: Build and run every lab starter's checks
        run: |
          fail=0
          shopt -s nullglob
          for proj in week-*/lab/starter/*.Checks/*.csproj; do
            echo "── $proj"
            if ! dotnet build "$proj" -warnaserror -nologo; then
              echo "::error::$proj does not build"
              fail=1
              continue
            fi
            # `|| code=$?` is load-bearing: this step runs under `bash -e`, so a
            # bare failing command aborts the whole script before the exit code
            # can be inspected. That is exactly what happened on week 1's first
            # push — the starter correctly reported 1/5 and CI called it a
            # failure, because line 2 never ran.
            code=0
            printf '\n\n\n\n' | timeout 300 dotnet test "$proj" --no-build --nologo || code=$?
            # 0 = all green, 1 = tests failed (fine). Anything else is a crash,
            # a hang (124 from timeout), or a runner problem.
            if [ "$code" -gt 1 ]; then
              echo "::error::$proj exited $code (crash, hang or runner error)"
              fail=1
            fi
          done
          exit $fail
