name: Export and publish slide decks

on:
  push:
    branches: [main]
    paths:
      - "week-*/slides.md"
      - "week-*/demo/**"
      - ".github/workflows/export-slides.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Until the first week lands there are no decks, and an unmatched glob
      # hands marp the literal string "week-*/slides.md" and fails the run —
      # which is exactly what this repo's first push did. Every later step is
      # gated on this, so an empty course is a clean no-op rather than a red X.
      - name: Is there anything to publish?
        id: weeks
        run: |
          shopt -s nullglob
          decks=(week-*/slides.md)
          echo "${#decks[@]} deck(s) found"
          if [ ${#decks[@]} -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.weeks.outputs.any == 'true'
        with:
          node-version: 22

      - name: Export every deck to HTML
        if: steps.weeks.outputs.any == 'true'
        run: |
          shopt -s nullglob
          for f in week-*/slides.md; do
            npx -y @marp-team/marp-cli "$f" -o "${f%.md}.html"
          done

      # The lab slide's "⏱️ NN minutes" becomes a live countdown with a Start
      # button. Marp turns the ⏱️ into a twemoji <img>, so the script keys off
      # that image and the duration text after it — nothing to author per week,
      # and a deck with no lab slide is left alone.
      - name: Add the lab countdown to each deck
        if: steps.weeks.outputs.any == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const js = fs.readFileSync("scripts/lab-timer.js", "utf8");
            let n = 0;
            for (const f of process.argv.slice(1)) {
              let h = fs.readFileSync(f, "utf8");
              if (h.includes("data-lab-timer")) continue;
              if (!h.includes("</body>")) { console.log("no </body>: " + f); continue; }
              fs.writeFileSync(f, h.replace("</body>", "<script data-lab-timer>" + js + "</script></body>"));
              n++;
            }
            console.log("lab timer injected into " + n + " deck(s)");
          ' week-*/slides.html

      - name: Commit regenerated decks
        if: steps.weeks.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-*/slides.html
          git diff --cached --quiet || git commit -m "Regenerate slide decks [skip ci]"
          git push

      # Pages hosts decks and the instructor demo-script checklists — public-repo
      # material only. NEVER answer-key content (solutions, graders, keys).
      #
      # NOTE — the web course's sticky "Port box" is deliberately absent: this
      # course has no localhost URLs to retarget. The RULE it existed to enforce
      # still applies (never make the instructor hand-edit a value mid-demo), and
      # the EF Core weeks will need their own version of it for the database name.
      # Build that control when week 10 lands; don't ship an instruction to retype.
      # Syntax highlighting for the cue sheets happens HERE, at build time, so the
      # published page carries the <span>s already and needs no CDN or runtime JS.
      # The sheet is read live at the projector; a second origin that can fail on
      # its own is exactly what it does not need. Installed to a temp prefix
      # because the repo deliberately has no package.json.
      - name: Cue-sheet renderer deps
        if: steps.weeks.outputs.any == 'true'
        run: npm i --no-save --silent --prefix "$RUNNER_TEMP/cuedeps" marked marked-highlight highlight.js

      - name: Assemble Pages site
        if: steps.weeks.outputs.any == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/cuedeps/node_modules
        run: |
          shopt -s nullglob
          mkdir -p _site
          STYLE='body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3;line-height:1.6}a{color:#79c0ff}code{background:#151b23;padding:.1rem .35rem;border-radius:4px}pre{background:#151b23;padding:.8rem;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}li{margin:.35rem 0}input[type=checkbox]{transform:scale(1.3);margin-right:.5rem}li:has(input:checked){opacity:.45;text-decoration:line-through}li.task{cursor:pointer}li.task a,li.task pre,li.task button{cursor:auto}li.task a{cursor:pointer}li>p{display:inline;margin:0}button{padding:.3rem .9rem}em.say{font-style:normal;color:#ffcf6b;background:rgba(255,207,107,.07);border-radius:3px;padding:0 .15rem;box-decoration-break:clone;-webkit-box-decoration-break:clone}em.say::before{content:"🗣 ";font-size:.85em;opacity:.75}strong em.say{font-weight:600}blockquote{border-left:3px solid #79c0ff;margin-left:0;padding-left:1rem;color:#a5b4c4}details{margin:.5rem 0}pre{position:relative}pre button.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .5rem;font-size:.72rem;line-height:1.4;background:#243040;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;cursor:pointer;opacity:.55}pre button.copy:hover,pre:hover button.copy{opacity:1}blockquote.alert{border-left:4px solid var(--c);background:#151b23;color:#e6edf3;padding:.7rem 1rem;border-radius:0 6px 6px 0;margin:1rem 0}blockquote.alert>p:first-of-type::before{display:block;color:var(--c);font-weight:600;letter-spacing:.02em;margin-bottom:.2rem}blockquote.alert>*:last-child{margin-bottom:0}blockquote.alert.note{--c:#4493f8}blockquote.alert.note>p:first-of-type::before{content:"ℹ️ Note"}blockquote.alert.tip{--c:#3fb950}blockquote.alert.tip>p:first-of-type::before{content:"💡 Tip"}blockquote.alert.important{--c:#ab7df8}blockquote.alert.important>p:first-of-type::before{content:"❗ Important"}blockquote.alert.warning{--c:#d29922}blockquote.alert.warning>p:first-of-type::before{content:"⚠️ Warning"}blockquote.alert.caution{--c:#f85149}blockquote.alert.caution>p:first-of-type::before{content:"🛑 Caution"}pre .hljs-keyword,pre .hljs-literal{color:#ff7b72}pre .hljs-string{color:#a5d6ff}pre .hljs-title,pre .hljs-title.function_{color:#d2a8ff}pre .hljs-comment{color:#9198a1;font-style:italic}pre .hljs-attr,pre .hljs-attribute,pre .hljs-number{color:#79c0ff}pre .hljs-built_in,pre .hljs-type{color:#ffa657}pre .hljs-name,pre .hljs-tag{color:#7ee787}pre .hljs-meta{color:#79c0ff}'
          checklist () { # $1 md  $2 out  $3 storage-prefix  $4 title
            {
              echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
              echo "<title>$4</title><style>$STYLE</style>"
              echo "</head><body><button onclick=\"Object.keys(localStorage).filter(k=>k.startsWith('$3')).forEach(k=>localStorage.removeItem(k));location.reload()\">Reset checkboxes</button>"
              # marked has no GitHub-alert extension, so `> [!TIP]` survives as literal
              # text in a plain blockquote. Tag the blockquote and let CSS draw the
              # heading — the sheets lean on these to mark the restore steps.
              sed "s|](\.\./|](https://github.com/jgrissom/dotnet-db-dev/blob/main/$wk/|g" "$1" | node "$GITHUB_WORKSPACE/scripts/render-cue-html.js" \
                | perl -0pe 's{<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*}{<blockquote class="alert \L$1\E"><p>}g'
              echo "<script>document.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;const k='$3-'+i;cb.checked=localStorage.getItem(k)==='1';cb.addEventListener('change',()=>localStorage.setItem(k,cb.checked?'1':'0'));});</script>"
              # SPOKEN TEXT gets its own colour. The sheets mark anything said aloud as
              # *"…"* — italic, quoted — which renders as <em> starting with a quote. Tag
              # those and the CSS turns them amber with a 🗣 marker, so at a glance the
              # sheet separates "say this" from "do this". Nothing in the source changes,
              # and GitHub keeps rendering plain italics. (Quotes are straight " in every
              # sheet; the curly forms are matched too in case one gets typed by an editor.)
              echo "<script>document.querySelectorAll('em').forEach(function(e){if(/^[\"“]/.test(e.textContent.trim()))e.classList.add('say');});</script>"
              # The whole line toggles its box — the sheet is read off a tablet mid-demo
              # and the box alone is a poor target. Anything interactive inside the line
              # must NOT toggle: links, Copy buttons, code blocks, and <details> (whose
              # triangle is a widget, not text). Nor should finishing a text selection.
              echo "<script>document.querySelectorAll('li').forEach(function(li){var cb=li.querySelector(':scope > input[type=checkbox], :scope > p > input[type=checkbox]');if(!cb)return;li.classList.add('task');li.addEventListener('click',function(e){if(e.target===cb)return;if(e.target.closest('a,button,pre,details'))return;var n=e.target.closest('li');if(n!==li&&n.classList.contains('task'))return;if((getSelection()+'').length)return;cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));});});</script>"
              # Copy button on every code block — you're grabbing these mid-demo.
              echo "<script>document.querySelectorAll('pre').forEach(function(pre){var b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copy';b.addEventListener('click',function(){var c=pre.querySelector('code');var t=(c||pre).innerText;navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1200);},function(){var r=document.createRange();r.selectNodeContents(c||pre);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Press Cmd/Ctrl+C';setTimeout(function(){b.textContent='Copy';},2000);});});pre.appendChild(b);});</script></body></html>"
            } > "$2"
          }
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>.NET Database Dev — Slide Decks</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3}a{color:#79c0ff;text-decoration:none;font-size:1.2rem}li{margin:.6rem 0}h1{font-size:1.5rem}</style>'
            echo '</head><body><h1>.NET Database Development — Slide Decks</h1><ul>'
            for f in week-*/slides.md; do
              wk="${f%/slides.md}"
              mkdir -p "_site/$wk"
              cp "${f%.md}.html" "_site/$wk/index.html"
              extra=""
              if [ -f "$wk/demo/demo-script.md" ]; then
                mkdir -p "_site/$wk/demo"
                checklist "$wk/demo/demo-script.md" "_site/$wk/demo/script.html" "$wk-step" "$wk demo script"
                extra="$extra · <a href=\"$wk/demo/script.html\">script</a>"
              fi
              echo "<li><a href=\"$wk/\">${wk/week-0/Week }</a>$extra</li>"
            done
            echo '</ul><p>Navigate decks with arrow keys · F for fullscreen</p></body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.weeks.outputs.any == 'true'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.weeks.outputs.any == 'true'
